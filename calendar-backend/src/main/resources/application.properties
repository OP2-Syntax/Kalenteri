spring.application.name=calendar

# Tietokannan yhteystiedot luetaan ympäristömuuttujista.
# Oletusarvot (kaksoispisteen jälkeen) käytössä paikallisessa kehityksessä.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/calendar_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:tamaOnHyvinPitkaJaSalainenAvainJotaEiPidaJakaaKenellekaan123456}
jwt.expiration=86400000